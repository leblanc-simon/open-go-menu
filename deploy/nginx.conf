# OpenGoMenu — reverse proxy nginx. Voir docs/deploiement.md.
#
# À copier dans /etc/nginx/sites-available/ (ou conf.d/) en remplaçant
# menu.example.org, puis : nginx -t && systemctl reload nginx
#
# L'application n'a pas d'authentification : nginx s'en charge (basic auth ici),
# termine TLS et transmet l'IP du client pour la limite de débit.

upstream open_go_menu {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name menu.example.org;

    # Laisser passer le défi ACME (certbot --webroot), tout le reste va en HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menu.example.org;

    ssl_certificate     /etc/letsencrypt/live/menu.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menu.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:open_go_menu:10m;
    ssl_session_timeout 1d;

    # L'application envoie déjà CSP, X-Frame-Options, X-Content-Type-Options et
    # Referrer-Policy : ne pas les redoubler ici. HSTS relève de TLS, donc de nginx.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Les formulaires sont petits ; rien ne justifie un gros corps de requête.
    client_max_body_size 64k;

    auth_basic           "OpenGoMenu";
    auth_basic_user_file /etc/nginx/open-go-menu.htpasswd;

    location / {
        proxy_pass http://open_go_menu;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Lu par la limite de débit, si 127.0.0.1 figure dans trusted_proxies.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # Donne l'attribut Secure au cookie CSRF.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 35s;
    }

    # Installation en application (EI-06) : le manifeste et les icônes ne
    # révèlent rien, et Android les récupère aussi sans les identifiants du
    # navigateur. Ils échappent donc à l'authentification.
    location = /manifest.webmanifest {
        auth_basic off;
        proxy_pass http://open_go_menu;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/icons/ {
        auth_basic off;
        proxy_pass http://open_go_menu;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1h;
    }

    # CSS, JS et icône sont embarqués dans le binaire et changent avec lui :
    # un cache court suffit, et ils échappent déjà à la limite de débit.
    location /static/ {
        proxy_pass http://open_go_menu;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1h;
    }
}
