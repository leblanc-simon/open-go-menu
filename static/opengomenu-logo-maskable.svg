<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Variante pleine page (icône « maskable », icône Apple) : le système découpe
       la forme ; le dessin tient dans la zone sûre, un cercle de 40 % de rayon. -->
  <rect width="512" height="512" fill="#2F855A"/>
  <g transform="translate(71.7 71.7) scale(0.72)">
    <!-- Assiette -->
    <circle cx="210" cy="245" r="140" fill="#FFFFFF"/>
    <circle cx="210" cy="245" r="100" fill="none" stroke="#C6F6D5" stroke-width="10"/>
    <!-- Feuille au centre de l'assiette -->
    <path d="M165 290 C165 215 215 185 270 185 C270 260 225 290 165 290 Z" fill="#48BB78"/>
    <path d="M172 283 L245 212" stroke="#2F855A" stroke-width="7" stroke-linecap="round"/>
    <!-- Ombre de la liste -->
    <rect x="298" y="262" width="160" height="190" rx="22" fill="#22543D" opacity="0.35"/>
    <!-- Liste de courses -->
    <rect x="290" y="250" width="160" height="190" rx="22" fill="#FFF7EC"/>
    <rect x="290" y="250" width="160" height="44" rx="22" fill="#F6AD55"/>
    <rect x="290" y="272" width="160" height="22" fill="#F6AD55"/>
    <!-- Lignes cochées -->
    <path d="M312 322 l10 10 l18 -20" fill="none" stroke="#2F855A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="354" y1="324" x2="426" y2="324" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
    <path d="M312 366 l10 10 l18 -20" fill="none" stroke="#2F855A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="354" y1="368" x2="426" y2="368" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
    <!-- Ligne non cochée -->
    <rect x="313" y="400" width="24" height="24" rx="6" fill="none" stroke="#A0AEC0" stroke-width="5"/>
    <line x1="354" y1="412" x2="410" y2="412" stroke="#CBD5E0" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
