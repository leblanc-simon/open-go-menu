  intro:
    dish: Dishes that make a meal on their own.
    starch: The starch of a composed meal.
    protein: The meat or fish of a composed meal.
    vegetable: The vegetable of a composed meal.
  weights_hint: >-
    Each weight ranges from 0 to 10. The higher it is, the more often the item
    comes up: its odds on a given day are the general weight times the
    season's. A weight of 0 keeps it out of the draw. A new item starts at {{.Weight}} everywhere.
  name: Name
  weight: General weight
  delete: Delete
  save: Save the list
  empty:
    dish: No full dish yet. Add one below.
    starch: No starch yet. Add one below.
    protein: No meat or fish yet. Add some below.
    vegetable: No vegetable yet. Add one below.
