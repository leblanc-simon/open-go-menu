    dish: Add a full dish
    starch: Add a starch
    protein: Add a meat or fish
    vegetable: Add a vegetable
  placeholder:
    dish: Potato gratin
    starch: Basmati rice
    protein: Salmon fillet
    vegetable: Green beans
  add_button: Add
  articles:
    hint: >-
      Anything that can be bought: the ingredients of the recipes, the
      components of the meals, and what you add to the shopping list by hand.
      The aisle files the article in the list.
    no_aisle: Create aisles
    aisle: Aisle
    none: No aisle
    save: Save the articles
    empty: No article yet.
    add: Add an article
    placeholder: Toilet paper
    uses:
      one: "In {{.Count}} recipe"
      other: "In {{.Count}} recipes"
  aisles:
    hint: >-
      The aisles of the shop, in the order you walk through them: the
      shopping list follows it. Articles without aisle come last.
    save: Save the aisles
    empty: No aisle yet.
    add: Add an aisle
    placeholder: Fruit and vegetables
    up_label: "Move “{{.Name}}” up"
    down_label: "Move “{{.Name}}” down"
    drag: Drag to reorder
  schedule:
    hint: >-
      Tick the meals to plan, day by day. A fixed meal comes back every week
      instead of being drawn.
    planned: "{{.Day}} — {{.Meal}}"
    always: "Always:"
    drawn: Drawn at random
    fix: Fix a meal
    change: Change
    fix_label: "Fix a meal: {{.Day}} — {{.Meal}}"
    change_label: "Change the fixed meal: {{.Day}} — {{.Meal}}"
  fixed:
    back: ← Meals
    title: "Fixed meal: {{.Day}} — {{.Meal}}"
    hint: >-
      This meal is served every week when the week is generated, instead of
      being drawn. It can still be changed week by week from the home page.
    save: Save
    clear: Draw it at random again
  ingredients:
    none: Ingredients
    count:
      one: "{{.Count}} ingredient"
      other: "{{.Count}} ingredients"
  dish:
    back: ← Full dishes
    title: "Ingredients: {{.Name}}"
    hint: >-
      The ingredients of the recipe, carried to the shopping list. Your
      starches, meats, fish and vegetables are suggested as you type; an
      ingredient added here does not join those lists.
    empty: No ingredient yet.
    save: Save the quantities
    quantity: Quantity
    quantity_placeholder: 200 g
    aisle_keep: —
    aisle_hint: The aisle applies to the article everywhere, other recipes included.
    add: Add an ingredient
    placeholder: Peeled tomatoes
    remove: Remove
    remove_label: "Remove “{{.Name}}”"
  share: Share of composed meals
  share_hint: >-
    At 0 %, every meal is a full dish; at 100 %, every meal pairs a starch, a
    meat or fish and a vegetable. When only one of the two forms has items
    available, that one is drawn.
  meals_save: Save

