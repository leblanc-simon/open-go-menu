settings:
  title: Paramètres
  tabs_label: Rubriques du paramétrage
  tab:
    dish: Plats complets
    starch: Féculents
    protein: Viandes et poissons
    vegetable: Légumes
    articles: Articles
    aisles: Rayons
    meals: Repas
  intro:
    dish: Des plats qui font un repas à eux seuls.
    starch: Le féculent d'un repas composé.
    protein: La viande ou le poisson d'un repas composé.
    vegetable: Le légume d'un repas composé.
  weights_hint: >-
    Chaque poids va de 0 à 10. Plus il est élevé, plus l'élément sort souvent :
    ses chances un jour donné sont le poids général multiplié par celui de la
    saison. Un poids à 0 l'écarte du tirage. Un nouvel élément part à {{.Weight}} partout.
  name: Nom
  weight: Poids général
  delete: Supprimer
  save: Enregistrer la liste
  empty:
    dish: Aucun plat complet pour l'instant. Ajoutez-en un ci-dessous.
    starch: Aucun féculent pour l'instant. Ajoutez-en un ci-dessous.
    protein: Aucune viande ni aucun poisson pour l'instant. Ajoutez-en ci-dessous.
    vegetable: Aucun légume pour l'instant. Ajoutez-en un ci-dessous.
  add:
    dish: Ajouter un plat complet
    starch: Ajouter un féculent
    protein: Ajouter une viande ou un poisson
    vegetable: Ajouter un légume
  placeholder:
    dish: Gratin dauphinois
    starch: Riz basmati
    protein: Filet de saumon
    vegetable: Haricots verts
  add_button: Ajouter
  articles:
    hint: >-
      Tout ce qui peut s'acheter : les ingrédients des recettes, les composants
      des repas, et ce que vous ajoutez à la main à la liste de courses. Le
      rayon range l'article dans la liste.
    no_aisle: Créer des rayons
    aisle: Rayon
    none: Sans rayon
    save: Enregistrer les articles
    empty: Aucun article pour l'instant.
    add: Ajouter un article
    placeholder: Papier toilette
    uses:
      one: "Dans {{.Count}} recette"
      other: "Dans {{.Count}} recettes"
  aisles:
    hint: >-
      Les rayons du magasin, dans l'ordre où vous les parcourez : la liste de
      courses suit cet ordre. Les articles sans rayon viennent à la fin.
    save: Enregistrer les rayons
    empty: Aucun rayon pour l'instant.
    add: Ajouter un rayon
    placeholder: Fruits et légumes
    up_label: "Monter « {{.Name}} »"
    down_label: "Descendre « {{.Name}} »"
    drag: Glisser pour changer l'ordre
  schedule:
    hint: >-
      Cochez les repas à prévoir, jour par jour. Un repas fixe revient chaque
      semaine à la place du tirage au sort.
    planned: "{{.Day}} — {{.Meal}}"
    always: "Toujours :"
    drawn: Tirage au sort
    fix: Fixer un repas
    change: Modifier
    fix_label: "Fixer un repas : {{.Day}} — {{.Meal}}"
    change_label: "Modifier le repas fixe : {{.Day}} — {{.Meal}}"
  fixed:
    back: ← Repas
    title: "Repas fixe : {{.Day}} — {{.Meal}}"
    hint: >-
      Ce repas est servi chaque semaine à la génération, au lieu d'être tiré au
      sort. Il reste modifiable semaine par semaine depuis la page d'accueil.
    save: Enregistrer
    clear: Revenir au tirage au sort
  ingredients:
    none: Ingrédients
    count:
      one: "{{.Count}} ingrédient"
      other: "{{.Count}} ingrédients"
  dish:
    back: ← Plats complets
    title: "Ingrédients : {{.Name}}"
    hint: >-
      Les ingrédients de la recette, repris dans la liste de courses. Vos
      féculents, viandes, poissons et légumes sont proposés à la saisie ; un
      ingrédient ajouté ici ne rejoint pas ces listes.
    empty: Aucun ingrédient pour l'instant.
    save: Enregistrer les quantités
    quantity: Quantité
    quantity_placeholder: 200 g
    aisle_keep: —
    aisle_hint: Le rayon s'applique à l'article partout, y compris dans les autres recettes.
    add: Ajouter un ingrédient
    placeholder: Tomates pelées
    remove: Retirer
    remove_label: "Retirer « {{.Name}} »"
  share: Part de repas composés
  share_hint: >-
    À 0 %, chaque repas est un plat complet ; à 100 %, chaque repas associe un
    féculent, une viande ou un poisson et un légume. Si une seule des deux
    formes a des éléments disponibles, c'est elle qui est tirée.
  meals_save: Enregistrer

